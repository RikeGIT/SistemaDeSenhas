<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Atendente - Sistema de Senhas</title>

    <style>

        body {
            font-family: sans-serif, Arial;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container{
            max-width:1000px;
            margin:auto;
            display:flex;
            gap:30px;
        }

        .painel{
            flex:2;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 6px rgba(0,0,0,0.1);
        }

        .historico{
            flex:1;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 6px rgba(0,0,0,0.1);
            max-height:500px;
            overflow-y:auto;
        }

        h1{
            margin-top:0;
        }

        button{
            width:100%;
            padding:15px;
            margin:10px 0;
            font-size:16px;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-weight:bold;
        }

        .btn-chamar{
            background-color:#28a745;
            color:white;
        }

        .btn-chamar:hover{
            background-color:#218838;
        }

        .btn-finalizar{
            background-color:#dc3545;
            color:white;
        }

        .btn-trocar{
            background-color:#6c757d;
            color:white;
            font-size:14px;
            padding:10px;
        }

        .info-atendimento{
            margin-top:20px;
            padding:15px;
            background:#e9ecef;
            border-left:5px solid #007bff;
            display:none;
        }

        #infoGuiche{
            color:#555;
            border-bottom:1px solid #ddd;
            padding-bottom:10px;
        }

        /* HISTORICO */

        .historico-item{
            padding:15px;
            border-bottom:1px solid #eee;
            text-align:center;
        }

        .historico-item span{
            display:block;
            margin-bottom:8px;
            font-size:16px;
        }

        /* BOTAO RECHAMAR */

        .btn-rechamar{
            background-color:#007bff;
            color:white;
            border:none;
            padding:6px 10px;
            border-radius:6px;
            cursor:pointer;
            font-size:13px;
            width:80%;
        }

        .btn-rechamar:hover{
            background-color:#0056b3;
        }

        /* RESPONSIVIDADE */

        @media(max-width:900px){

            .container{
                flex-direction:column;
            }

            .historico{
                max-height:none;
            }

            body{
                padding:20px;
            }

        }

    </style>
</head>

<body>
<nav style="background-color: #343a40; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="margin: 0; color: white;">Painel do Atendente</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span>Olá, <strong id="nomeAtendente"></strong></span>
        <button onclick="logout()" style="background-color: #bd2130; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Sair</button>
    </div>
</nav>

<div class="container">

    <div class="painel">

        <h1>Painel de Atendimento</h1>

        <h3 id="infoGuiche">Carregando informações...</h3>

        <button class="btn-chamar" onclick="chamarProximo()">
            CHAMAR PRÓXIMA SENHA
        </button>

        <div id="atendimentoAtual" class="info-atendimento">

            <h3>Atendimento em curso:</h3>

            <p>
                <strong>Senha:</strong>
                <span id="senhaChamada" style="font-size:24px;color:#007bff;"></span>
            </p>

            <p id="detalhesAtendimento"></p>

            <button class="btn-finalizar" onclick="finalizarAtendimento()">
                FINALIZAR ATENDIMENTO
            </button>

        </div>

        <button class="btn-trocar" onclick="trocarGuiche()">
            Trocar de Guichê
        </button>

    </div>

    <div class="historico">

        <h2>Últimas Chamadas</h2>

        <div id="listaHistorico">

            <p>Nenhuma senha chamada ainda.</p>

        </div>

    </div>

</div>

<script>
    let atendimentoAtivoId = null;
    const guicheIdLogado = localStorage.getItem('guicheId');
    const atendenteLogado = JSON.parse(localStorage.getItem('atendente'));

    let historico = JSON.parse(localStorage.getItem('historicoAtendente')) || [];

    window.onload = () => {
        if (!atendenteLogado) {
            window.location.href = "/login.html";
            return;
        }
        if (!guicheIdLogado) {
            window.location.href = "/selecionar-guiche.html";
            return;
        }

        document.getElementById('nomeAtendente').innerText = atendenteLogado.nome;
        document.getElementById('infoGuiche').innerText = `Logado no Guichê ID: ${guicheIdLogado}`;

        verificarAtendimentoAtual();
        atualizarHistorico(); // Mostra o histórico salvo assim que a página carrega
    };

    async function trocarGuiche() {
        try {
            const response = await fetch(`/atendimentos/atual/${guicheIdLogado}`);
            if (response.status === 200) {
                alert("Finalize o atendimento atual antes de trocar de guichê.");
                return;
            }
            localStorage.removeItem('guicheId');
            window.location.href = "/selecionar-guiche.html";
        } catch (error) {
            alert("Erro ao verificar atendimento atual.");
        }
    }

    async function chamarProximo() {
        try {
            const response = await fetch(`/atendimentos/chamar/${guicheIdLogado}`, { method: 'POST' });

            if (response.status === 204) {
                alert("Não há senhas aguardando.");
                return;
            }

            if (!response.ok) {
                const dadosErro = await response.json();
                const mensagem = dadosErro.message || "Existe uma senha recem chamada na fila, aguarde um pouco.";

                alert(`⚠️ Atenção: ${mensagem}`);
                return;
            }

            const data = await response.json();
            exibirAtendimento(data);
            adicionarHistorico(data);
        } catch (error) {
            alert("Erro na comunicação com o servidor.");
        }
    }

    async function verificarAtendimentoAtual() {
        try {
            const response = await fetch(`/atendimentos/atual/${guicheIdLogado}`);
            if (response.status === 200) {
                const data = await response.json();
                exibirAtendimento(data, true);
            }
        } catch (error) {
            console.error("Erro ao verificar atendimento atual", error);
        }
    }

    function exibirAtendimento(data, retomado = false) {
        atendimentoAtivoId = data.id;
        document.getElementById('atendimentoAtual').style.display = 'block';
        document.getElementById('senhaChamada').innerText = data.senha?.codigo ?? "N/A";

        const hora = new Date(data.dataHoraInicio).toLocaleTimeString();
        document.getElementById('detalhesAtendimento').innerText =
            (retomado ? "Retomado - " : "") + `Iniciado em: ${hora}`;
    }

    async function finalizarAtendimento() {
        if (!atendimentoAtivoId) return;
        try {
            await fetch(`/atendimentos/finalizar/${atendimentoAtivoId}`, {
                method: 'PUT'
            });
            alert("Atendimento finalizado!");
            document.getElementById('atendimentoAtual').style.display = 'none';
            atendimentoAtivoId = null;
        } catch (error) {
            alert("Erro ao finalizar atendimento.");
        }
    }

    // Função unificada para adicionar ao histórico e persistir
    function adicionarHistorico(data) {
        // Verifica se a senha já não está no topo para não duplicar no rechamado
        if (!historico.find(h => h.id === data.id)) {
            historico.unshift(data);
            if (historico.length > 10) historico.pop();

            localStorage.setItem('historicoAtendente', JSON.stringify(historico));
            atualizarHistorico();
        }
    }

    function atualizarHistorico() {
        const lista = document.getElementById('listaHistorico');
        if (!lista) return;

        lista.innerHTML = "";
        historico.forEach(atendimento => {
            const div = document.createElement("div");
            div.className = "historico-item";
            div.innerHTML = `
                <span>${atendimento.senha.codigo}</span>
                <button class="btn-rechamar" onclick="rechamarSenha(${atendimento.id})">
                    Rechamar
                </button>
            `;
            lista.appendChild(div);
        });
    }

    async function rechamarSenha(atendimentoId) {
        try {
            const response = await fetch(`/atendimentos/rechamar/${atendimentoId}`, {
                method: 'POST'
            });

            if (response.ok) {
                const data = await response.json();
                alert("Senha rechamada!");
                exibirAtendimento(data);
                // Opcional: mover para o topo do histórico se quiser que o rechamado suba
            }
        } catch (error) {
            alert("Erro ao rechamar senha");
        }
    }
    function logout() {
        // Removemos os dados do atendente e do guichê para segurança
        localStorage.removeItem('atendente');
        localStorage.removeItem('guicheId');
        window.location.href = "/login.html";
    }
</script>

</body>
</html>
