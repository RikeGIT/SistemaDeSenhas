<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Totem de Senhas</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            width:750px;
            text-align:center;
        }

        h1{
            margin-bottom:20px;
        }

        .section{
            margin-bottom:20px;
        }

        .section h2{
            margin-bottom:10px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:12px;
            flex-wrap:nowrap;
        }

        .btn-opcao{
            padding:12px 18px;
            font-size:16px;
            border-radius:8px;
            border:2px solid #007bff;
            background:white;
            cursor:pointer;
            transition:0.2s;
            min-width:110px;
        }

        .btn-opcao:hover{
            background:#e7f1ff;
        }

        .selecionado{
            background:#007bff;
            color:white;
        }

        .escolha{
            margin-top:8px;
            font-size:18px;
            font-weight:bold;
            color:#007bff;
        }

        .btn-gerar{
            margin-top:20px;
            padding:16px;
            width:100%;
            font-size:22px;
            border-radius:10px;
            border:none;
            background:#28a745;
            color:white;
            cursor:pointer;
        }

        .btn-gerar:hover{
            background:#1e7e34;
        }

        #resultado{
            margin-top:20px;
            padding:15px;
            border:2px dashed #007bff;
            border-radius:10px;
            display:none;
        }

        #senhaCodigo{
            font-size:50px;
            color:#007bff;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Retirar Senha</h1>

    <div class="section">

        <h2>Escolha o Serviço</h2>

        <div class="buttons">

            <button class="btn-opcao" onclick="selecionarServico(1,'Caixa',this)">Caixa</button>

            <button class="btn-opcao" onclick="selecionarServico(2,'Gerência',this)">Gerência</button>

            <button class="btn-opcao" onclick="selecionarServico(3,'Suporte',this)">Suporte</button>

        </div>

        <div class="escolha" id="servicoEscolhido">
            Nenhum serviço selecionado
        </div>

    </div>


    <div class="section">

        <h2>Tipo de Atendimento</h2>

        <div class="buttons">

            <button class="btn-opcao" onclick="selecionarPrioridade(1,'Normal',this)">Normal</button>

            <button class="btn-opcao" onclick="selecionarPrioridade(2,'Gestante/Autista',this)">Gestante/Autista</button>

            <button class="btn-opcao" onclick="selecionarPrioridade(3,'Idoso 60+',this)">Idoso 60+</button>

            <button class="btn-opcao" onclick="selecionarPrioridade(4,'Idoso 80+',this)">Idoso 80+</button>

            <button class="btn-opcao" onclick="selecionarPrioridade(5,'Outro',this)">Outro</button>

        </div>

        <div class="escolha" id="prioridadeEscolhida">
            Nenhuma prioridade selecionada
        </div>

    </div>

    <button class="btn-gerar" onclick="gerarSenha()">
        GERAR SENHA
    </button>

    <div id="resultado">

        <h2 id="msg"></h2>

        <h1 id="senhaCodigo"></h1>

        <p id="detalhes"></p>

    </div>

</div>

<script>

    let servicoId = null;
    let prioridadeId = null;

    function selecionarServico(id,nome,botao){

        servicoId = id;

        document.querySelectorAll(".section")[0]
            .querySelectorAll(".btn-opcao")
            .forEach(btn => btn.classList.remove("selecionado"));

        botao.classList.add("selecionado");

        document.getElementById("servicoEscolhido")
            .innerText = "Serviço escolhido: " + nome;

    }

    function selecionarPrioridade(id,nome,botao){

        prioridadeId = id;

        document.querySelectorAll(".section")[1]
            .querySelectorAll(".btn-opcao")
            .forEach(btn => btn.classList.remove("selecionado"));

        botao.classList.add("selecionado");

        document.getElementById("prioridadeEscolhida")
            .innerText = "Tipo de atendimento: " + nome;

    }

    async function gerarSenha(){

        if(servicoId == null || prioridadeId == null){

            alert("Por favor escolha o serviço e o tipo de atendimento.");
            return;

        }

        const payload = {
            servicoId: servicoId,
            prioridadeId: prioridadeId
        };

        try{

            const response = await fetch('/senha',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify(payload)
            });

            const data = await response.json();

            document.getElementById("resultado").style.display="block";

            document.getElementById("msg").innerText = data.mensagem || "Senha gerada";

            document.getElementById("senhaCodigo").innerText = data.codigo || "Erro";

            document.getElementById("detalhes").innerText = "Serviço: " + (data.servico || "");

        }catch(error){

            alert("Erro ao gerar senha. Verifique o servidor.");

        }

    }

</script>

</body>
</html>
