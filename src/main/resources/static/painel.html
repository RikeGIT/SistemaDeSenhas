<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel de Senhas</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f9;
            margin:0;
        }

        /* LAYOUT PRINCIPAL */

        #layout{
            display:flex;
            min-height:100vh;
        }

        /* PAINEL CENTRAL */

        #painelCentral{
            flex:1;
            text-align:center;
            padding:20px;
        }

        h1{
            margin-top:30px;
            font-size:50px;
            color:#1a237e;
        }

        /* SENHA ATUAL */

        #senhaAtualBox{
            margin-top:60px;
        }

        #linhaPainel{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:120px;
            margin-top:30px;
        }

        .titulo{
            font-size:30px;
            font-weight:bold;
            color:#333;
        }

        .valor{
            font-size:90px;
            font-weight:bold;
            background:white;
            color:#1a237e;
            padding:40px 80px;
            border-radius:12px;
            display:inline-block;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        /* HISTÓRICO */

        #historicoLateral{
            width:260px;
            background:white;
            border-left:3px solid #e0e0e0;
            padding:20px;
        }

        #historicoLateral h2{
            text-align:center;
        }

        #lista{
            margin-top:20px;
        }

        .item{
            font-size:26px;
            margin:10px 0;
            padding:12px;
            background:#f5f5f5;
            border-radius:8px;
            text-align:center;
        }

        /* RESPONSIVIDADE */

        @media (max-width:900px){

            #layout{
                flex-direction:column;
            }

            #historicoLateral{
                width:100%;
                border-left:none;
                border-top:3px solid #e0e0e0;
            }

        }

        @media (max-width:768px){

            h1{
                font-size:36px;
            }

            #linhaPainel{
                gap:40px;
            }

            .titulo{
                font-size:22px;
            }

            .valor{
                font-size:60px;
                padding:20px 40px;
            }

        }

        @media (max-width:480px){

            #linhaPainel{
                flex-direction:row;
                gap:20px;
            }

            .valor{
                font-size:45px;
                padding:15px 25px;
            }

            .titulo{
                font-size:18px;
            }

        }

    </style>
</head>

<body>

<div id="layout">

    <div id="painelCentral">

        <h1>Painel de Atendimento</h1>

        <div id="senhaAtualBox">

            <div id="linhaPainel">

                <div>
                    <div class="titulo">Senha</div>
                    <div id="senhaAtual" class="valor">---</div>
                </div>

                <div>
                    <div class="titulo">Guichê</div>
                    <div id="guicheAtual" class="valor">---</div>
                </div>

            </div>

        </div>

    </div>

    <div id="historicoLateral">

        <h2>Últimas Chamadas</h2>

        <div id="lista"></div>

    </div>

</div>

<audio id="audioChamada" src="/audio/chamada.mp3" preload="auto"></audio>

<script>
    let historico = JSON.parse(localStorage.getItem("historicoSenhas")) || [];
    let ultimaSenhaCodigo = localStorage.getItem("ultimaSenhaCodigo") || null;
    let loopSonoro = null;

    async function atualizarPainel() {
        try {
            const response = await fetch("/atendimentos/painel");
            const atendimentos = await response.json();

            const senhaAtualDiv = document.getElementById("senhaAtual");
            const guicheAtualDiv = document.getElementById("guicheAtual");
            const lista = document.getElementById("lista");

            if (atendimentos.length > 0) {
                const atendimentoAtual = atendimentos[0];
                const senhaAtual = atendimentoAtual.senha.codigo;
                const guicheAtual = atendimentoAtual.guiche.numero;

                // 1. Verifica se é uma senha nova para disparar o alerta
                if (senhaAtual !== ultimaSenhaCodigo) {

                    // Atualiza o DOM imediatamente
                    senhaAtualDiv.innerText = senhaAtual;
                    guicheAtualDiv.innerText = guicheAtual;

                    // Dispara o alerta reforçado (3 vezes no total)
                    executarAlertaReforcado();

                    // Atualiza o controle da última senha
                    ultimaSenhaCodigo = senhaAtual;
                    localStorage.setItem("ultimaSenhaCodigo", ultimaSenhaCodigo);

                    // Gerencia o histórico (Evita duplicatas visuais)
                    const entradaHistorico = `${senhaAtual} - G${guicheAtual}`;
                    if (!historico.includes(entradaHistorico)) {
                        historico.unshift(entradaHistorico);
                        if (historico.length > 10) historico.pop();
                        localStorage.setItem("historicoSenhas", JSON.stringify(historico));
                    }

                    renderizarHistorico();
                }
            }
        } catch (error) {
            console.log("Erro ao atualizar painel");
        }
    }

    function executarAlertaReforcado() {
        const som = document.getElementById("audioChamada");

        // Limpa qualquer loop anterior para não encavalar sons
        if (loopSonoro) clearInterval(loopSonoro);

        let execucoes = 0;

        const tocar = () => {
            som.currentTime = 0;
            som.play().catch(e => console.log("Aguardando interação para áudio"));
            execucoes++;

            // Se já tocou 3 vezes (inicial + 2 repetições), encerra o loop
            if (execucoes >= 3) {
                clearInterval(loopSonoro);
                loopSonoro = null;
            }
        };

        tocar(); // Primeira execução imediata
        loopSonoro = setInterval(tocar, 10000); // Repete a cada 10 segundos
    }

    function renderizarHistorico() {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";
        historico.forEach(function(s) {
            const div = document.createElement("div");
            div.className = "item";
            div.innerText = s;
            lista.appendChild(div);
        });
    }

    setInterval(atualizarPainel, 2000);
    atualizarPainel();
    renderizarHistorico();
</script>

</body>
</html>
