<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Senhas</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; margin: 0; }
        #layout { display: flex; min-height: 100vh; }

        /* ÁREA DOS CARDS ATIVOS */
        #painelCentral { flex: 1; text-align: center; padding: 20px; display: flex; flex-direction: column; }
        h1 { margin-top: 30px; font-size: 50px; color: #1a237e; }
        #containerAtivos { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin-top: 40px; padding: 20px; }

        .card-ativo {
            background: white; padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-width: 280px;
            border: 4px solid transparent; transition: 0.3s;
        }

        /* Destaque para a senha mais recente */
        .card-ativo.recente { border-color: #28a745; transform: scale(1.05); box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3); }
        .piscar { animation: flash 1s iteration-count 3; }
        @keyframes flash { 50% { opacity: 0.5; background-color: #e8f5e9; } }

        .titulo { font-size: 24px; font-weight: bold; color: #777; text-transform: uppercase; }
        .senha { font-size: 80px; font-weight: bold; color: #1a237e; margin: 10px 0; }
        .guiche { font-size: 30px; font-weight: bold; color: #333; }

        /* HISTÓRICO LATERAL */
        #historicoLateral { width: 300px; background: white; border-left: 3px solid #e0e0e0; padding: 20px; }
        #historicoLateral h2 { text-align: center; color: #1a237e; border-bottom: 2px solid #f4f6f9; padding-bottom: 10px; }
        .item { font-size: 22px; margin: 10px 0; padding: 15px; background: #f5f5f5; border-radius: 8px; text-align: center; font-weight: bold; }

        @media (max-width:900px){
            #layout { flex-direction: column; }
            #historicoLateral { width: 100%; border-left: none; border-top: 3px solid #e0e0e0; }
        }
    </style>
</head>
<body>

<div id="layout">
    <div id="painelCentral">
        <h1>Painel de Atendimento</h1>
        <div id="containerAtivos"></div>
    </div>

    <div id="historicoLateral">
        <h2>Chamadas Recentes</h2>
        <div id="lista"></div>
    </div>
</div>

<audio id="audioChamada" src="/audio/chamada.mp3" preload="auto"></audio>

<script>
    let historico = JSON.parse(localStorage.getItem("historicoSenhas")) || [];
    let ultimaSenhaCodigo = localStorage.getItem("ultimaSenhaCodigo") || null;
    let loopSonoro = null;

    async function atualizarPainel() {
        try {
            // Usa o endpoint correto que retorna atendimentos com fim nulo
            const response = await fetch('/atendimentos/painel');
            let atendimentos = await response.json();

            const containerAtivos = document.getElementById("containerAtivos");

            if (atendimentos.length === 0) {
                containerAtivos.innerHTML = "<h2 style='color:#888;'>Nenhuma senha sendo atendida.</h2>";
                return;
            }

            // Ordena para que o atendimento iniciado por último fique primeiro
            atendimentos.sort((a, b) => new Date(b.dataHoraInicio) - new Date(a.dataHoraInicio));

            const maisRecente = atendimentos[0];
            const codigoSenha = maisRecente.senha.codigo;
            const nomeGuiche = `${maisRecente.guiche.nome}`;

            // Verifica se uma NOVA senha foi chamada para disparar o som e histórico
            if (codigoSenha !== ultimaSenhaCodigo) {
                executarAlertaReforcado();
                ultimaSenhaCodigo = codigoSenha;
                localStorage.setItem("ultimaSenhaCodigo", ultimaSenhaCodigo);

                const entrada = `${codigoSenha} - ${nomeGuiche}`;
                if (!historico.includes(entrada)) {
                    historico.unshift(entrada);
                    if (historico.length > 10) historico.pop();
                    localStorage.setItem("historicoSenhas", JSON.stringify(historico));
                }
                renderizarHistorico();
            }

            // Renderiza os cards para todos os atendimentos ativos
            containerAtivos.innerHTML = "";
            atendimentos.forEach((atend, index) => {
                const div = document.createElement("div");
                // Aplica destaque e piscar apenas no card que acabou de ser chamado
                const classeDestaque = (index === 0 && loopSonoro !== null) ? "recente piscar" : "";
                div.className = `card-ativo ${classeDestaque}`;

                div.innerHTML = `
                    <div class="titulo">Senha</div>
                    <div class="senha">${atend.senha.codigo}</div>
                    <div class="guiche">${atend.guiche.nome}</div>
                `;
                containerAtivos.appendChild(div);
            });

        } catch (error) {
            console.error("Erro ao carregar painel:", error);
        }
    }

    function executarAlertaReforcado() {
        const som = document.getElementById("audioChamada");
        if (loopSonoro) clearInterval(loopSonoro);

        let execucoes = 0;
        const tocar = () => {
            som.currentTime = 0;
            som.play().catch(e => console.log("Interação necessária para áudio"));
            execucoes++;
            if (execucoes >= 3) {
                clearInterval(loopSonoro);
                loopSonoro = null;
                atualizarPainel(); // Atualiza para remover a borda de destaque
            }
        };

        tocar();
        loopSonoro = setInterval(tocar, 10000);
    }

    function renderizarHistorico() {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";
        historico.forEach(s => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerText = s;
            lista.appendChild(div);
        });
    }

    // Intervalo de atualização sincronizado com o tempo de chamada
    setInterval(atualizarPainel, 2000);
    atualizarPainel();
    renderizarHistorico();
</script>
</body>
</html>
